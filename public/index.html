<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Barbie's Bazar ✦</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header>
    <img src="banner.svg" alt="Barbie's Bazar" />
  </header>

  <section class="controls">
    <div class="control-group">
      <span class="control-icon">🔍</span>
      <input id="search" type="text" placeholder="buscar produto..." autocomplete="off" />
    </div>
    <div class="control-group">
      <span class="control-icon">🏷️</span>
      <select id="category">
        <option value="todas">Todas</option>
      </select>
    </div>
    <button id="btnRender">✦ Renderizar</button>
  </section>

  <main>
    <div id="product-list"></div>
  </main>

  <section id="product-details"></section>

  <footer>
    <p>✦ Barbie's Bazar © 2026 — feito com muito pink ✦</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
